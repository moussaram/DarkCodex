<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abonnements — DarkCodex</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <main>
    <h1>Abonnements DarkCodex</h1>
    <p class="doux" id="solde"></p>
    <div class="grille" id="plans"></div>
    <div class="msg" id="msg"></div>
  </main>
  <script type="module">
    import { exigerConnexion, apiFetch } from "/static/auth.js";

    const $ = (id) => document.getElementById(id);

    const nombre = (n) => Number(n).toLocaleString("fr-FR");

    function message(texte, type) { const m = $("msg"); m.textContent = texte; m.className = "msg " + type; }

    function element(balise, texte, classe) { const e = document.createElement(balise); if (texte !== undefined) e.textContent = texte; if (classe) e.className = classe; return e; }

    const ATTENTE = ["pending", "processing", "created", "initiated", "open", "inconnu"];

    const pause = (ms) => new Promise((r) => setTimeout(r, ms));

    async function chargerSolde() {
      const solde = await apiFetch("/solde").then((r) => r.json()).catch(() => null);
      if (solde && solde.tokens_solde !== undefined) {
        $("solde").textContent = "Solde actuel : " + nombre(solde.tokens_solde) + " tokens (plan " + solde.plan + ")";
      }
      return solde;
    }

    async function verifierPaiement() {
      message("Vérification du paiement en cours…", "");
      for (let essai = 0; essai < 14; essai++) {
        const id = localStorage.getItem("dk_paiement");
        const reponse = await apiFetch("/confirmer-paiement", {
          method: "POST",
          body: JSON.stringify(id ? { session_id: id } : {}),
        });
        const data = await reponse.json().catch(() => ({}));
        const detail = data.detail && typeof data.detail === "object" ? data.detail : {};
        if (reponse.ok && (data.status === "confirme" || data.status === "deja_credite")) {
          localStorage.removeItem("dk_paiement");
          history.replaceState(null, "", location.pathname);
          await chargerSolde();
          const soldeTexte = data.tokens_solde !== undefined
            ? " Nouveau solde : " + nombre(data.tokens_solde) + " tokens."
            : "";
          message(
            (data.status === "confirme" ? "✅ Paiement confirmé." : "Ce paiement a déjà été crédité.")
              + soldeTexte + " Retournez dans DarkCodex et tapez /solde.",
            "ok"
          );
          return;
        }
        if (reponse.status === 402 && ATTENTE.includes(String(detail.etat))) { await pause(3000); continue; }
        message(reponse.status === 402
          ? "Le paiement n'a pas abouti (état : " + detail.etat + ")."
          : "Vérification impossible pour le moment.", "ko");
        return;
      }
      message("Paiement en cours de vérification : vos tokens arriveront automatiquement dans quelques minutes.", "");
    }

    async function payer(plan, bouton) {
      bouton.disabled = true;
      try {
        const reponse = await apiFetch("/paiement/creer", { method: "POST", body: JSON.stringify({ plan }) });
        const data = await reponse.json().catch(() => ({}));
        if (!reponse.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Impossible de lancer le paiement.");
        const lien = new URL(data.checkout_url);
        if (lien.protocol !== "https:") throw new Error("Lien de paiement invalide.");
        localStorage.setItem("dk_paiement", data.session_id); // lu par /paiement/retour
        location.href = lien.href;
      } catch (erreur) { message(String(erreur.message || erreur), "ko"); bouton.disabled = false; }
    }

    const session = await exigerConnexion();

    if (session) {
      try {
        const plans = await fetch("/plans").then((r) => r.json());

        for (const plan of plans) {
          const carte = element("div", undefined, "carte");
          carte.append(element("h2", plan.nom));
          carte.append(element("p", plan.prix_fcfa > 0 ? nombre(plan.prix_fcfa) + " FCFA" : "Gratuit", "prix"));
          carte.append(element("p", plan.description || (nombre(plan.tokens) + " tokens"), "doux"));

          if (plan.prix_fcfa > 0) {
            const bouton = element("button", "Payer");
            bouton.addEventListener("click", () => payer(plan.nom, bouton));
            carte.append(bouton);
          } else carte.append(element("p", "Inclus à l'inscription", "doux"));

          $("plans").append(carte);
        }
      } catch (erreur) { message("Impossible de charger les plans.", "ko"); }

      await chargerSolde();

      // Retour de SasPay (?retour=1 ou session mémorisée) : vérification ~40 s.
      if (new URLSearchParams(location.search).has("retour") || localStorage.getItem("dk_paiement")) {
        await verifierPaiement();
      }
    }
  </script>
</body>
</html>
