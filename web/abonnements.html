<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abonnements — DarkCodex</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <main>
    <h1>Abonnements DarkCodex</h1>
    <p class="doux" id="solde"></p>
    <div class="grille" id="plans"></div>
    <div class="msg" id="msg"></div>
  </main>
  <script type="module">
    import { exigerConnexion, apiFetch } from "/static/auth.js";

    const $ = (id) => document.getElementById(id);

    const nombre = (n) => Number(n).toLocaleString("fr-FR");

    function message(texte, type) { const m = $("msg"); m.textContent = texte; m.className = "msg " + type; }

    function element(balise, texte, classe) { const e = document.createElement(balise); if (texte !== undefined) e.textContent = texte; if (classe) e.className = classe; return e; }

    async function payer(plan, bouton) {
      bouton.disabled = true;
      try {
        const reponse = await apiFetch("/paiement/creer", { method: "POST", body: JSON.stringify({ plan }) });
        const data = await reponse.json().catch(() => ({}));
        if (!reponse.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Impossible de lancer le paiement.");
        const lien = new URL(data.checkout_url);
        if (lien.protocol !== "https:") throw new Error("Lien de paiement invalide.");
        localStorage.setItem("dk_paiement", data.session_id); // lu par /paiement/retour
        location.href = lien.href;
      } catch (erreur) { message(String(erreur.message || erreur), "ko"); bouton.disabled = false; }
    }

    const session = await exigerConnexion();

    if (session) {
      try {
        const [plans, solde] = await Promise.all([
          fetch("/plans").then((r) => r.json()),
          apiFetch("/solde").then((r) => r.json()).catch(() => null),
        ]);

        if (solde && solde.tokens_solde !== undefined) $("solde").textContent = "Solde actuel : " + nombre(solde.tokens_solde) + " tokens (plan " + solde.plan + ")";

        for (const plan of plans) {
          const carte = element("div", undefined, "carte");
          carte.append(element("h2", plan.nom));
          carte.append(element("p", plan.prix_fcfa > 0 ? nombre(plan.prix_fcfa) + " FCFA" : "Gratuit", "prix"));
          carte.append(element("p", plan.description || (nombre(plan.tokens) + " tokens"), "doux"));

          if (plan.prix_fcfa > 0) {
            const bouton = element("button", "Payer");
            bouton.addEventListener("click", () => payer(plan.nom, bouton));
            carte.append(bouton);
          } else carte.append(element("p", "Inclus à l'inscription", "doux"));

          $("plans").append(carte);
        }
      } catch (erreur) { message("Impossible de charger les plans.", "ko"); }
    }
  </script>
</body>
</html>
