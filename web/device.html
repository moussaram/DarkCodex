<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autoriser un terminal — DarkCodex</title>
  <link rel="stylesheet" href="/static/site.css">
  <script src="/static/nav.js" defer></script>
</head>
<body>
  <main>
    <h1>Autoriser un terminal</h1>
    <div class="carte cache" id="demande">
      <p>Un terminal demande l'accès au compte <strong id="compte"></strong>.</p>
      <p class="code" id="code-affiche"></p>
      <p class="doux">Vérifiez que ce code est identique à celui affiché dans votre terminal. Sinon, cliquez sur « Refuser ».</p>
      <p><button type="button" id="btn-autoriser">Autoriser</button> <button type="button" class="secondaire" id="btn-refuser">Refuser</button></p>
    </div>
    <div class="carte cache" id="saisie">
      <p>Saisissez le code affiché dans votre terminal.</p>
      <form id="form-code" novalidate>
        <label for="code">Code</label>
        <input id="code" placeholder="DARK-XXXX-XXXX" autocomplete="off">
        <p><button type="submit">Continuer</button></p>
      </form>
    </div>
    <div class="msg" id="msg"></div>
  </main>
  <script type="module">
    import { exigerConnexion, apiFetch, getSupabase } from "/static/auth.js";

    const $ = (id) => document.getElementById(id);

    const FORMAT = /^DARK-[A-Z0-9]{4}-[A-Z0-9]{4}$/;

    function normaliser(valeur) {
      let c = String(valeur || "").trim().toUpperCase().replace(/\s+/g, "");
      if (/^DARK(?!-)/.test(c)) c = c.replace(/^DARK/, "DARK-");
      return c;
    }

    function message(texte, type) { const m = $("msg"); m.textContent = texte; m.className = "msg " + type; }

    function afficherDemande(code) {
      $("saisie").classList.add("cache");
      $("code-affiche").textContent = code;
      $("demande").classList.remove("cache");
      $("btn-autoriser").onclick = () => autoriser(code);
      $("btn-refuser").onclick = () => { $("demande").classList.add("cache"); message("Demande refusée. Le code expirera tout seul.", "ok"); };
    }

    async function autoriser(code) {
      $("btn-autoriser").disabled = true;
      try {
        const reponse = await apiFetch("/device/confirm", {
          method: "POST",
          body: JSON.stringify({
            code,
            token: session.access_token,
            refresh_token: session.refresh_token,
          }),
        });
        const data = await reponse.json().catch(() => ({}));
        if (reponse.ok) {
          $("demande").classList.add("cache");
          message("Terminal connecté. Vous pouvez retourner dans votre terminal.", "ok");
          // Le terminal garde la session : le navigateur oublie sa copie
          // (scope "local" = ne révoque PAS la session côté serveur).
          const supabase = await getSupabase();
          await supabase.auth.signOut({ scope: "local" });
        } else {
          message(typeof data.detail === "string" ? data.detail : "Échec de l'autorisation.", "ko");
          $("btn-autoriser").disabled = false;
        }
      } catch (erreur) { message(String(erreur.message || erreur), "ko"); $("btn-autoriser").disabled = false; }
    }

    const session = await exigerConnexion(); // redirige vers /connexion si besoin, puis revient ici avec le code

    if (session) {
      $("compte").textContent = session.user.email;

      const code = normaliser(new URLSearchParams(location.search).get("code"));

      if (FORMAT.test(code)) afficherDemande(code);
      else $("saisie").classList.remove("cache");

      $("form-code").addEventListener("submit", (e) => {
        e.preventDefault();
        const saisi = normaliser($("code").value);
        if (FORMAT.test(saisi)) afficherDemande(saisi); else message("Code invalide (format DARK-XXXX-XXXX).", "ko");
      });
    }
  </script>
</body>
</html>
